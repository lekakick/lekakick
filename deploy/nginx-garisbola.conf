limit_req_zone $binary_remote_addr zone=garisbola:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 5.189.131.6 _;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_status 429;
    access_log /var/log/nginx/garisbola.access.log;
    error_log /var/log/nginx/garisbola.error.log warn;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\. {
        return 404;
    }
    location / {
        limit_except GET HEAD { deny all; }
        limit_req zone=garisbola burst=60 nodelay;
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
