name: Terbitkan lekakick

# Tiap 30 menit: ambil RSS, tulis rangkuman AI bila ada topik baru, lalu terbitkan ke Cloudflare Pages.
# Secrets yang dibutuhkan: DEEPSEEK_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Arsip RSS (berisi cuplikan media lain) disimpan di cache Actions, bukan di repo.
      - name: Pulihkan arsip RSS
        uses: actions/cache/restore@v6
        with:
          path: data/feeds.json
          key: rss-${{ github.run_id }}
          restore-keys: rss-

      - name: Ambil RSS, tulis artikel, bangun situs
        id: publish
        run: node dist/publish.js out
        env:
          DATA_DIR: data
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-pro' }}
          DIGEST_DAILY_LIMIT: ${{ vars.DIGEST_DAILY_LIMIT || '12' }}

      - name: Simpan arsip RSS
        if: hashFiles('data/feeds.json') != ''
        uses: actions/cache/save@v6
        with:
          path: data/feeds.json
          key: rss-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Simpan artikel ke repo
        run: |
          git diff --quiet -- data/digests.json && exit 0
          git config user.name 'lekakick-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digests.json
          git commit -m 'Perbarui arsip artikel'
          git pull --rebase && git push

      - name: Terbitkan ke Cloudflare Pages
        if: steps.publish.outputs.published == 'true' || github.event_name != 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Spasi/baris baru yang ikut tersalin ke Secrets membuat wrangler menolak nilai.
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID belum diatur; situs tidak diterbitkan."; exit 0
          fi
          npx wrangler pages project create lekakick --production-branch=main 2>/dev/null || true
          npx wrangler pages deploy out --project-name=lekakick --branch=main --commit-dirty=true
